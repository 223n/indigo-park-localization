# 機能の要望のフォーム。書き方の注意は 01-bug-report.yml にある。
# 訳の直しが要望として届いたことがある（#16、#18）ため、冒頭で翻訳のフォームとバグ報告のフォームへ案内する。
# 要望の種類の選択肢は、このMODで要望が出そうな単位に合わせてある。
name: 機能の要望
description: 日本語にする範囲や導入のしかたなど、新しい機能や改善を提案します
title: '[要望] '
labels:
  - 機能追加
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。
        困っていることや、やりたいことを中心に書いてください。
        どう実現するかは、後から一緒に考えられます。
        訳の誤りや、一部の文だけ英語のまま残っているときは、[翻訳の訂正と提案](https://github.com/223n/indigo-park-localization/issues/new?template=00-translation.yml)のフォームを使ってください。
        うまく動かないときは、[バグ報告](https://github.com/223n/indigo-park-localization/issues/new?template=01-bug-report.yml)のフォームを使ってください。

  - type: dropdown
    id: scope
    attributes:
      label: 要望の種類
      description: いちばん近いものを選んでください。
      options:
        - 日本語にする範囲を広げる（画像の中の文字など）
        - 文字の見た目（フォントや大きさ）
        - 導入と取り外し（install.bat、uninstall.bat）
        - ゲームの更新や、Windows以外への対応
        - 配布のしかたや説明（zip、README.txtなど）
        - 翻訳の作業のしかた（data/ja.po、tools/）
        - そのほか
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: 今、何に困っているか、何をしたいかを書いてください。
      placeholder: 例：字幕の文字が小さくて読みにくい
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: こうなるとうれしいこと
      description: |
        案があれば書いてください。
        なければ空のままで構いません。
      placeholder: 例：字幕の文字をもう少し大きくしてほしい

  - type: textarea
    id: screenshot
    attributes:
      label: 画面の写真
      description: 説明に役立つ写真があれば、この枠にそのまま落とせます。

  - type: checkboxes
    id: precheck
    attributes:
      label: 確認したこと
      options:
        - label: '[同じ内容のIssue](https://github.com/223n/indigo-park-localization/issues?q=is%3Aissue)がないことを確かめました'
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 貢献
      options:
        - label: 手伝えることがあれば協力します（訳を考える、ゲームで試すなど）
