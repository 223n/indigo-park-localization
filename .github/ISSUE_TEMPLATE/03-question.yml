# 質問のフォーム。書き方の注意は 01-bug-report.yml にある。
# 動かないことの相談がここに来ると切り分けに要ることが欠けるため、冒頭でバグ報告のフォームへ案内する。
name: 質問
description: 導入のしかたや、このMODでできることなどについて質問します
title: '[質問] '
labels:
  - 質問
body:
  - type: markdown
    attributes:
      value: |
        質問ありがとうございます。
        導入のしかたと、よくあるつまずきの直し方は[README.txt](https://github.com/223n/indigo-park-localization/blob/main/installer/README.txt)にあります。
        うまく動かないときは、[バグ報告](https://github.com/223n/indigo-park-localization/issues/new?template=01-bug-report.yml)のフォームを使ってください。
        そちらのほうが、原因を早く絞り込めます。

  - type: textarea
    id: question
    attributes:
      label: 聞きたいこと
      description: 何を知りたいかを書いてください。
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 試したことと調べたこと
      description: すでに試したことや、読んだ文書があれば書いてください。

  - type: textarea
    id: context
    attributes:
      label: やろうとしていること
      description: 何をしようとして、その疑問が出てきたかを書いてください。
