# Issue を作るときの選択画面の設定。
# 参考: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# 空の Issue は隠す。書き込み権限のある人には「Maintainers only」として残る
blank_issues_enabled: false

# フォームの外へ案内する先。url は絶対 URL で書く。リポジトリの名前を変えたときは、ここと各フォームの URL も書き換える。
# うまくいかないときの案内は、配布した zip に入っている README.txt と同じ内容を見せるため main を指す。
# 脆弱性の報告先は Settings > Advanced Security で Private vulnerability reporting を有効にしないと使えない
contact_links:
  - name: うまくいかないときの対処
    url: https://github.com/223n/indigo-park-localization/blob/main/installer/README.txt
    about: Issueを書く前に、導入のしかたと、よくあるつまずきの直し方を確かめてください。
  - name: 脆弱性の報告
    url: https://github.com/223n/indigo-park-localization/security/advisories/new
    about: セキュリティに関わる問題はIssueに書かず、非公開で報告してください。
