name: PRにラベルを付ける

# PR が変えたファイルとブランチ名から、.github/labeler.yml に従ってラベルを付ける。
#
# pull_request_target を使うのは、フォークからの PR でもラベルを書ける権限を得るためである。
# このイベントは base ブランチの内容で動くため、PR 側の設定変更は効かない。
# ただし PR のコードは絶対に checkout して実行してはならない。
#
# 設定（.github/labeler.yml）は base ブランチから取り出す。
# ローカルに設定が無いと actions/labeler は API で取りに行き、そのとき読むのは既定ブランチ（main）である。
# PR #20 で確かめた。develop にしかない規則は効かず、main にある規則だけが効いた。
# 規則を足してからリリースで main に届くまで効かない、という分かりにくい待ちが生まれる。
#
# 取り出しに actions/checkout は使わない。
# pull_request_target と checkout が揃うと zizmor の dangerous-triggers が出るためである。
# ignore で黙らせると、あとで誰かが PR の head を checkout したときに気付けなくなる。
# 代わりに gh api で base ブランチの設定ファイル1つだけを取り出す。
# 取り出すのは .github/labeler.yml だけで、PR 側のコードには触れない。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: ラベルを付ける
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read         # .github/labeler.yml を読む
      pull-requests: write   # ラベルを付ける
      issues: write          # ラベルの同期がまだのとき、ないラベルを作る。色と説明は次の同期で揃う
    steps:
      - name: baseブランチの設定を取り出す
        env:
          GH_TOKEN: ${{ github.token }}
          # base ブランチの名前。PR の head は指さない。
          # run に直に展開するとコマンドを差し込めるため、env を通して渡す（zizmor の template-injection）
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .github
          gh api -H 'Accept: application/vnd.github.raw' "repos/${REPO}/contents/.github/labeler.yml?ref=${BASE_REF}" > .github/labeler.yml
          echo "::notice::${BASE_REF} の設定で $(grep --count --extended-regexp '^[^[:space:]#]' .github/labeler.yml) 件の規則を読みました"

      - name: ラベルを付ける
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # 条件に合わなくなったラベルを外すか。人が付けたラベルまで外れることがあるため切ってある
          sync-labels: false
