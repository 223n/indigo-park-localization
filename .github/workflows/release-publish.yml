name: リリースを公開する

# release/vX.Y.Z または hotfix/* の PR が main にマージされたら、タグを打ち、GitHub Release を作り、main を develop に戻す。
#
# 人がマージしたときも、release.yml が RELEASE_TOKEN（PAT）でマージしたときも、pull_request(closed) で動く。
# GITHUB_TOKEN が行ったマージではこのワークフローが動かないため、release.yml は GITHUB_TOKEN ではマージしない。
#
# hotfix/* は main から切り、その PR の中で package.json の版を上げておく（npm version patch --no-git-tag-version）。
# 版を上げずにマージすると、同じ版のタグがすでに別のコミットにあるため、ここで止まる。
#
# Release は必ずドラフトで作り、配布物を添付してから公開する。
# 公開まで進めるかは、PR のラベル「自動公開」で決まる。無ければドラフトのまま止め、人が Releases の画面で公開する。
#
# 自動で公開するときは、人が添付を開いて確かめる機会が無くなる。
# 代わりに tools/verify_release.py が、添付そのものを落として中身を確かめる。
# 落ちたらドラフトのまま止まる。
#
# main を develop へ戻す PR（merge/vX.Y.Z-into-develop）は、RELEASE_TOKEN があればそれで開き、
# 別の job（merge-back）でチェックが通るのを待ってからマージする。
# 無ければ GITHUB_TOKEN で開いて、人がマージする。
on:
  pull_request:
    types: [closed]
    branches: [main]

# リリースは同時に1つずつ進める。途中の実行を止めると半端な状態が残るため、待たせる。
# release.yml の group: release とは別の名前にする。release.yml のマージを待つ job が握ったまま、ここを待たせないため
concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOP_BRANCH: develop
  MAIN_BRANCH: main

jobs:
  publish:
    name: タグとGitHub Releaseを作る
    # release/* か hotfix/* の PR がマージされたときだけ動く。
    # マージせずに閉じたときも closed で起動するため、merged を必ず見る
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write        # タグを打ち、Release を作る
      pull-requests: write   # main を develop へ戻す PR を開く
    outputs:
      # develop へ戻す PR の番号。merge-back が使う。確かめが落ちても渡るよう、確かめより前の step で書く
      merge_pr: ${{ steps.back.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: GitHub CLIがあることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）がない。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: mainを取得
        # zizmor: ignore[artipacked] このジョブはタグと develop を push するため、認証情報を残す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH }}
          # タグと develop を扱うため、履歴をすべて取る
          fetch-depth: 0

      - name: Nodeを用意
        # 版を package.json から読むのに使う。セルフホストのランナーに Node が無くても動く
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 版を決める
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 実際の版は main の package.json から取る
          actual="$(node -p "require('./package.json').version")"

          # 期待する版は、PR のブランチ名（release/vX.Y.Z）から取る。
          # hotfix/* はブランチ名に版を持たないため、package.json の版をそのまま使う
          case "${HEAD_REF}" in
            release/*) expected="${HEAD_REF#release/}"; expected="${expected#v}" ;;
            *) expected="${actual}" ;;
          esac
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${MAIN_BRANCH} の package.json の版（${actual}）とリリースの版（${expected}）が食い違う"
            exit 1
          fi

          prerelease=false
          case "${actual}" in
            *-*) prerelease=true ;;
          esac
          # 消すブランチ。マージした PR の head
          branch="${HEAD_REF}"
          {
            echo "version=${actual}"
            echo "tag=v${actual}"
            echo "branch=${branch}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: 公開するかを決める
        id: mode
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          publish=false
          reason='ラベル「自動公開」が無いため、ドラフトのままにする'
          case ",${LABELS}," in
            *,自動公開,*) publish=true; reason='PR にラベル「自動公開」が付いている' ;;
          esac
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "::notice::${reason}"
          echo "- 公開: ${publish}（${reason}）" >> "$GITHUB_STEP_SUMMARY"

      - name: マージの形を確かめる
        # マージコミット以外（squash、rebase）だと、develop で取り込んだ PR がリリースノートに載らない。
        # 止めはしないが、気付けるようにする
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -n "${MERGE_SHA}" ] && ! git rev-parse --verify --quiet "${MERGE_SHA}^2" >/dev/null; then
            echo "::warning::PR がマージコミット以外でマージされた。リリースノートに PR が載らないことがある。次からは Create a merge commit を選ぶ"
          fi

      - name: タグを打つ
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 同じタグを打ち直さない。片方の段だけが落ちて入れ直す場合に、ここで止まらないようにする。
          # ただし別のコミットを指しているなら、版を上げ忘れたまま同じ版を出そうとしている
          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::タグ ${TAG} はすでにこのコミットにある。打ち直さない"
              exit 0
            fi
            echo "::error::タグ ${TAG} はすでに別のコミットにある。package.json の版を上げてから ${MAIN_BRANCH} にマージする"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "${TAG}" --message "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: GitHub Releaseをドラフトで作る
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} はすでにある。作り直さない"
            exit 0
          fi
          # ドラフトで作る。添付と本文を人が確かめてから公開する
          # 本文は PR のタイトルとラベルから自動で作る。分類は .github/release.yml で決める
          args=(--draft --verify-tag --title "${TAG}" --generate-notes)
          if [ "${PRERELEASE}" = 'true' ]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"

      - name: Pythonを用意
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 配布物を組み立ててドラフトに添付する
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -q '\.zip$'; then
            echo "::notice::添付はすでにある。作り直さない"
            exit 0
          fi
          python tools/make_release.py | tee /tmp/release.log
          zip="$(find dist -maxdepth 1 -name '*.zip' | head -n 1)"
          if [ -z "${zip}" ]; then
            echo '::error::配布物ができなかった'
            exit 1
          fi
          sum="$(sha256sum "${zip}" | cut -d' ' -f1)"
          gh release upload "${TAG}" "${zip}" --clobber
          # 本文の先頭に、確かめる手掛かりを足す。
          # 表にバッククォートは使わない。単一引用符の中だと検査が誤解するため
          body="$(gh release view "${TAG}" --json body --jq '.body')"
          # 作り直したときに表が二重にならないよう、前に書いた節（6行）を落とす
          if [ "$(printf '%s\n' "${body}" | head -n 1)" = '### 配布物' ]; then
            body="$(printf '%s\n' "${body}" | tail -n +7)"
          fi
          {
            printf '### 配布物\n\n'
            printf '| ファイル | SHA256 |\n| ---- | ---- |\n'
            printf '| %s | %s |\n\n' "$(basename "${zip}")" "${sum}"
            printf '%s\n' "${body}"
          } > /tmp/body.md
          gh release edit "${TAG}" --notes-file /tmp/body.md
          echo "- 配布物: $(basename "${zip}")（SHA256: ${sum}）" >> "$GITHUB_STEP_SUMMARY"

      - name: mainをdevelopへ戻す
        id: back
        # 版の更新を develop にも届ける。まず直接押し、保護されていて押せなければ PR を開く。
        # PR は RELEASE_TOKEN があればそれで開く。CI が承認なしで動き、merge-back が待ってからマージする。
        # 再実行しても壊れないよう、同じ PR がすでにあればそれを使う
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${DEVELOP_BRANCH}"
          git switch --create back-merge "origin/${DEVELOP_BRANCH}"

          if git merge-base --is-ancestor "origin/${MAIN_BRANCH}" HEAD; then
            echo "${DEVELOP_BRANCH} はすでに ${MAIN_BRANCH} を含んでいる"
            exit 0
          fi

          # 共通の祖先がないと merge も PR も作れない。下の PR のフォールバックへ回しても、
          # head と base の履歴が繋がらないため gh pr create が拒まれる。ここで止める
          if ! git merge-base "origin/${MAIN_BRANCH}" HEAD >/dev/null 2>&1; then
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} に共通の祖先がない。タグと Release は作れたが、${DEVELOP_BRANCH} への戻しはできない。README の「履歴が繋がっていないとき」を見て直す"
            exit 1
          fi

          if git merge --no-ff --no-edit --message "${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込む（${TAG}）" "origin/${MAIN_BRANCH}"; then
            if git push origin "HEAD:${DEVELOP_BRANCH}"; then
              echo "- ${DEVELOP_BRANCH}: ${MAIN_BRANCH} を直接取り込んだ" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::${DEVELOP_BRANCH} に直接押せなかった。PR で取り込む"
          else
            # abort に失敗しても、下の PR のフォールバックまで進めるようにする
            git merge --abort || true
            echo "::warning::${MAIN_BRANCH} と ${DEVELOP_BRANCH} が衝突する。PR で取り込む"
          fi

          # 直接押せなかったときは、main の内容をそのまま載せたブランチから PR を開く
          branch="merge/${TAG}-into-${DEVELOP_BRANCH}"
          url="$(gh pr list --base "${DEVELOP_BRANCH}" --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${url}" ]; then
            echo "::notice::取り込みの PR はすでにある: ${url}"
          else
            git switch --create "${branch}" "origin/${MAIN_BRANCH}"
            git push --set-upstream origin "${branch}"
            # 引数はトークンと本文
            create_pr() {
              GH_TOKEN="$1" gh pr create \
                --base "${DEVELOP_BRANCH}" \
                --head "${branch}" \
                --title "${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込む（${TAG}）" \
                --body "$2"
            }
            body="リリース ${TAG} で上げた版を \`${DEVELOP_BRANCH}\` にも反映します。衝突があれば、この PR の上で解消してください。マージコミット（Create a merge commit）でマージしてください。"
            if [ -n "${RELEASE_TOKEN}" ] \
              && url="$(create_pr "${RELEASE_TOKEN}" "${body} チェックが通ったら、「リリースを公開する」ワークフローが自動でマージします。")"; then
              :
            else
              if [ -n "${RELEASE_TOKEN}" ]; then
                echo "::warning::RELEASE_TOKEN で PR を開けなかった。期限と「Pull requests」の権限を確かめる。GITHUB_TOKEN で開く"
              fi
              # GITHUB_TOKEN で開いた PR の CI は承認待ちになる。
              # それでも head は main のコミットで、main への push で CodeQL が解析済みのため、承認せずにマージできる
              url="$(create_pr "${GH_TOKEN}" "${body} ${MAIN_BRANCH} の CodeQL が終わっていれば、CI の承認をせずにマージできます。")"
            fi
            gh pr edit "${url##*/}" --add-label 'リリース' \
              || echo "::warning::ラベル「リリース」を付けられなかった"
          fi
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "- ${DEVELOP_BRANCH}: PR で取り込む ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: リリースブランチを消す
        # マージ済みのブランチを残すと、次のリリースの「release/* が残っていないか」の確認に引っかかる
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git push origin --delete "${BRANCH}"
            echo "ブランチ ${BRANCH} を消した"
          else
            echo "ブランチ ${BRANCH} はすでにない"
          fi

      - name: 配布物を確かめる
        # 自動で公開するときだけ動かす。
        # 組み立てた物ではなく、添付そのものを落として確かめる。
        # 添付がすでにあって組み立てを飛ばした場合も、実際に配る物を見られる。
        #
        # develop への戻しとブランチの削除より後に置いてある。
        # ここで落ちても、後始末は済んでいる状態にするためである
        if: steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/verify
          mkdir -p /tmp/verify
          gh release download "${TAG}" --pattern '*.zip' --dir /tmp/verify
          zip="$(find /tmp/verify -maxdepth 1 -name '*.zip' | head -n 1)"
          if [ -z "${zip}" ]; then
            echo '::error::添付を落とせなかった。ドラフトのまま残す'
            exit 1
          fi
          if python tools/verify_release.py "${zip}"; then
            exit 0
          fi
          # 落ちた添付を残すと、作り直す step が「添付はすでにある」で飛ばすため、
          # 直して再実行しても同じ物を見続けることになる。ここで消しておく
          echo '::error::配布物の確かめに落ちた。添付を消すので、直してから再実行する'
          gh release delete-asset "${TAG}" "$(basename "${zip}")" --yes \
            || echo '::warning::添付を消せなかった。再実行の前に手で消す'
          exit 1

      - name: Releaseを公開する
        if: steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${TAG}" --json isDraft --jq '.isDraft')" = 'false' ]; then
            echo "::notice::Release ${TAG} はすでに公開されている"
          else
            gh release edit "${TAG}" --draft=false
          fi
          url="$(gh release view "${TAG}" --json url --jq '.url')"
          echo "- Release（公開済み）: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Release ${TAG} を公開した: ${url}"

      - name: 公開はしないことを知らせる
        if: steps.mode.outputs.publish != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          url="$(gh release view "${TAG}" --json url --jq '.url')"
          echo "- Release（ドラフト）: ${url}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '添付と本文を確かめてから、Releases の画面で「Publish release」を押してください。'
            echo 'ドラフトのままではタグだけが公開され、Release は表に出ません。'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Release ${TAG} はドラフトです。確かめてから公開してください: ${url}"

  merge-back:
    name: developへ戻すPRをマージする
    needs: publish
    # develop へ戻す PR を開いたときだけ動く。配布物の確かめで publish が落ちても、戻しは進める。
    # 取り消されたときは動かさない
    if: ${{ !cancelled() && needs.publish.outputs.merge_pr != '' }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # チェックを待つ上限（30分）と、マージのやり直しの分を見込む
    timeout-minutes: 40
    permissions:
      contents: read         # 待ち合わせのスクリプトを取り出す
      pull-requests: read    # PR を読む
      checks: read           # チェックの結果を読む
      statuses: read         # コミットのステータスを読む
      actions: read          # gh pr checks がワークフローの実行を読む
    steps:
      - name: RELEASE_TOKENがあるかを確かめる
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ needs.publish.outputs.merge_pr }}
        run: |
          if [ -n "${RELEASE_TOKEN}" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN が無いため、develop へ戻す PR #${PR_NUMBER} は人がマージする"
          fi

      - name: GitHub CLIがあることを確かめる
        if: steps.token.outputs.usable == 'true'
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）がない。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: 待ち合わせのスクリプトを取得
        if: steps.token.outputs.usable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: チェックが通るのを待ってマージする
        if: steps.token.outputs.usable == 'true'
        # head は main のコミットなので、main への push で動いた CodeQL が終わるまで待つことがある。
        # 衝突していたら止まる。その場合は PR の上で衝突を解いて、人がマージする
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ needs.publish.outputs.merge_pr }}
          EXPECT_BASE: ${{ env.DEVELOP_BRANCH }}
          EXPECT_HEAD_PREFIX: merge/
          WAIT_MINUTES: '30'
          MERGE_BODY: '「リリースを公開する」ワークフローが、チェックの完了を待ってマージした。'
        run: bash .github/scripts/merge-pr.sh
