name: リリース

# 版を入力すると、develop から release/vX.Y.Z ブランチを切り、版を上げて main への PR を開く。
#
#   develop ──▶ release/vX.Y.Z ──(PR)──▶ main ──▶ タグ vX.Y.Z と GitHub Release ──▶ develop へ戻す
#
# PR がマージされると「リリースを公開する」（release-publish.yml）が動き、
# タグと GitHub Release を作って main を develop に戻す。
#
# PR の作成とマージには、持ち主の fine-grained PAT（secret の RELEASE_TOKEN）を使う。
# GITHUB_TOKEN で開いた PR では、CI が承認待ちのまま動かない。
# GITHUB_TOKEN でマージしても pull_request(closed) のワークフローは動かず、
# ワークフローのファイルを変える PR は workflows 権限が無いためマージもできない。
# PAT には Contents、Pull requests、Workflows の書き込みを付ける。README の「リリース用のトークン」を見る。
#
# job は3つに分ける。
#   check    版と中身を確かめる。npm ci と npm run lint で依存のコードを動かすため、秘密情報を渡さず、読み取りだけにする
#   prepare  release ブランチを切って版を上げ、PR を開く。依存のコードは動かさない。RELEASE_TOKEN を使う
#   merge    チェックが通るのを待って、PR を RELEASE_TOKEN でマージする（.github/scripts/merge-pr.sh）
# 依存が乗っ取られても、RELEASE_TOKEN を抜かれたり、release ブランチを書き換えられたりしないようにするためである。
#
# auto_merge が有効なら、merge がマージし、release-publish.yml が pull_request(closed) で動いて公開まで進む。
# RELEASE_TOKEN が無いか使えないときは警告を出し、GITHUB_TOKEN で PR を開くだけにする。
# その場合は人が PR の「Approve workflows to run」を押すか閉じて開き直し、チェックが通ったらマージする。
#
# auto_publish を有効にすると、Release をドラフトで止めずに公開する。
# release-publish.yml には、PR に「自動公開」ラベルを付けて伝える。
# 公開の前に tools/verify_release.py が添付を落として中身を確かめ、落ちたらドラフトのまま止まる。
#
# PR は必ずマージコミット（Create a merge commit）でマージする。
# squash や rebase にすると、リリースノートに develop で取り込んだ PR が載らず、次の版の PR が衝突する。
#
# 一度だけ要る設定:
#   Settings > Actions > General > Workflow permissions で
#   「Allow GitHub Actions to create and approve pull requests」を有効にする。
#   RELEASE_TOKEN が使えないときに、GITHUB_TOKEN で PR を開くために要る。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースする版。v は付けない（例: 1.2.0、1.2.0-rc.1）'
        required: true
        type: string
      auto_merge:
        description: 'チェックが通るのを待って PR をマージし、タグと GitHub Release まで進める。RELEASE_TOKEN が要る'
        required: false
        type: boolean
        default: true
      auto_publish:
        description: '配布物の確かめが通ったら、Release をドラフトで止めず公開する'
        required: false
        type: boolean
        default: true

# リリースは同時に1つだけ動かす。途中の実行を止めると半端な状態が残るため、待たせる
concurrency:
  group: release
  cancel-in-progress: false

# 既定は読み取りだけにする。要る権限は各ジョブで足す
permissions:
  contents: read

env:
  DEVELOP_BRANCH: develop
  MAIN_BRANCH: main

jobs:
  check:
    name: 版と中身を確かめる
    # npm ci と npm run lint で依存のコードを動かすため、秘密情報を参照せず、書き込みの権限も持たせない
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: GitHub CLIがあることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）がない。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: 版の書式を確かめる
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          # semver.org が示す正規表現。先頭の 0 や空の識別子（rc..1）は通さない
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^${num}\.${num}\.${num}(-${ident}(\.${ident})*)?$"
          if ! printf '%s' "${version}" | grep -Eq "${re}"; then
            echo "::error::版の書式が違う: ${INPUT_VERSION}（例: 1.2.0、1.2.0-rc.1）"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "branch=release/v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: developブランチがあることを確かめる
        # ないまま checkout に進むと、原因の分かりにくい失敗になる
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${DEVELOP_BRANCH}" --silent 2>/dev/null; then
            echo "::error::${DEVELOP_BRANCH} ブランチがない。main から作ってから実行する"
            exit 1
          fi

      - name: developを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEVELOP_BRANCH }}
          # 最新のタグと main の版と比べるため、履歴とタグをすべて取る
          fetch-depth: 0
          # この job は push しない。依存のコードに認証情報を触らせない
          persist-credentials: false

      - name: Nodeを用意
        # 版の比較にも node を使うため、その前に用意する。セルフホストのランナーに Node が無くても動く
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: タグとブランチが未使用で、版が新しいことを確かめる
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          # checkout は認証情報を残さないため、リモートの状態は git ではなく gh api で見る
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::タグ ${TAG} はすでにある"
            exit 1
          fi
          # release ブランチは同時に1つだけ。別の版が残っていると、後の PR が package.json で衝突する
          left="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/release/" --jq '.[].ref')"
          if [ -n "${left}" ]; then
            echo "::error::release/* ブランチが残っている。前のリリースの PR をマージする。PR を閉じただけなら、そのブランチを消してから実行する"
            printf '%s\n' "${left}"
            exit 1
          fi

          # 今の版より大きいことを確かめる。
          # 基準は develop の版だけでなく、main の版と最新のタグも見る。
          # 前のリリースの戻しが止まっていると develop の版が古いままになるためである。
          # 比べ方は semver の 11 項に従う。識別子を . で分け、数字どうしは数値、英字は文字列で比べ、
          # 数字と英字なら数字が小さい。数字が同じなら正式版がプレリリースより大きい
          current="$(node -p "require('./package.json').version")"
          main_version="$(git show "origin/${MAIN_BRANCH}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "develop: ${current} / main: ${main_version:-無し} / 最新のタグ: ${latest_tag:-無し}"

          node -e '
            const [next, ...bases] = process.argv.slice(1)
            const parse = (v) => {
              const [core, ...pre] = v.split("-")
              return { core: core.split(".").map(Number), pre: pre.join("-") }
            }
            const cmpIdent = (a, b) => {
              const an = /^[0-9]+$/.test(a)
              const bn = /^[0-9]+$/.test(b)
              if (an && bn) return Math.sign(Number(a) - Number(b))
              if (an) return -1
              if (bn) return 1
              return a < b ? -1 : a > b ? 1 : 0
            }
            const cmpPre = (a, b) => {
              if (!a && !b) return 0
              if (!a) return 1
              if (!b) return -1
              const as = a.split(".")
              const bs = b.split(".")
              for (let i = 0; i < Math.max(as.length, bs.length); i += 1) {
                if (as[i] === undefined) return -1
                if (bs[i] === undefined) return 1
                const c = cmpIdent(as[i], bs[i])
                if (c !== 0) return c
              }
              return 0
            }
            const compare = (a, b) => {
              const pa = parse(a)
              const pb = parse(b)
              for (let i = 0; i < 3; i += 1) {
                const c = Math.sign(pa.core[i] - pb.core[i])
                if (c !== 0) return c
              }
              return cmpPre(pa.pre, pb.pre)
            }
            for (const base of bases.filter(Boolean)) {
              const c = compare(next, base)
              if (c === 0) {
                console.log("::error::" + next + " は今の版と同じである")
                process.exit(1)
              }
              if (c < 0) {
                console.log("::error::" + next + " は今の版 " + base + " より小さい")
                process.exit(1)
              }
            }
            console.log("版: " + bases.filter(Boolean).join(", ") + " → " + next)
          ' "${VERSION}" "${current}" "${main_version}" "${latest_tag#v}"

      - name: 検査を通す
        # 壊れたものをリリースブランチに載せない。
        # release ブランチは、この develop に main を取り込み、版を上げただけのものになる。
        # RELEASE_TOKEN が使えずに GITHUB_TOKEN で PR を開くと、PR の CI は承認待ちで止まるため、ここでも検査しておく
        run: npm run lint

  prepare:
    name: リリースブランチとPRを作る
    needs: check
    # 依存のコードは動かさない（npm ci も npm run lint もしない）。RELEASE_TOKEN を参照するため
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write        # release ブランチを押す
      pull-requests: write   # PR を開き、ラベルを付ける
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}
      auto_merge: ${{ steps.pr.outputs.auto_merge }}
      head_sha: ${{ steps.push.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: GitHub CLIがあることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）がない。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: 版を決める
        id: version
        # check の outputs は使わず、入力から作り直す。check は依存のコードを動かすため、その出力を頼りにしない。
        # 書式は check で確かめてある
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "branch=release/v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: リリース用のトークンを確かめる
        id: token
        # 期限切れや失効は、ここで見つける。使えないときは止めずに、GITHUB_TOKEN で PR を開くだけにする。
        # 読めるかどうかしか確かめられない。Pull requests の不足は PR の作成で、
        # Workflows と Contents の不足はマージの待ちで BLOCKED が続くことで分かる
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          usable=false
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::warning::secret の RELEASE_TOKEN がない。PR は GITHUB_TOKEN で開くため、CI は承認待ちになり、自動ではマージしない"
          elif GH_TOKEN="${RELEASE_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}" --silent 2>/dev/null; then
            usable=true
          else
            echo "::warning::RELEASE_TOKEN でリポジトリを読めない。期限切れか失効の恐れがある。PR は GITHUB_TOKEN で開き、自動ではマージしない"
          fi
          echo "usable=${usable}" >> "$GITHUB_OUTPUT"

      - name: developを取得
        # zizmor: ignore[artipacked] このジョブは release ブランチを push するため、認証情報を残す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEVELOP_BRANCH }}
          # main を取り込むため、履歴をすべて取る
          fetch-depth: 0

      - name: Nodeを用意
        # npm version と版の確かめに使う。依存は入れない
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: リリースブランチを切って版を上げる
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "${BRANCH}"

          # 共通の祖先がないと、木の中身が同じでも merge は必ず拒まれる。
          # テンプレートから「Include all branches」で作ったリポジトリがこの状態になる。
          # 先に確かめて、原因の分かる形で止める
          if ! git merge-base "origin/${MAIN_BRANCH}" HEAD >/dev/null 2>&1; then
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} に共通の祖先がない。README の「履歴が繋がっていないとき」を見て直してから実行する"
            exit 1
          fi

          # main の内容を先に取り込む。前のリリースの戻しが develop に入っていなくても、
          # main への PR が package.json で衝突しないようにする。普段は何も変わらない
          if ! git merge --no-edit "origin/${MAIN_BRANCH}"; then
            # マージが始まる前に拒まれたときは MERGE_HEAD が無く、git merge --abort 自体が失敗する。
            # 既定のシェルは bash -e なので、そのままだと下の案内が出ないまま落ちる
            git merge --abort || true
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} が衝突する。先に ${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込んでから実行する"
            exit 1
          fi

          # package.json と package-lock.json の版を書き換える。タグはまだ打たない。
          # --ignore-scripts で、package.json の version 系のスクリプトも動かさない
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${VERSION}" ]; then
            echo "::error::package.json の版が ${VERSION} にならなかった（${actual}）"
            exit 1
          fi

      - name: コミットして押す
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git add package.json package-lock.json
          git commit -m "版を ${VERSION} に上げる"
          git push --set-upstream origin "${BRANCH}"
          # merge がこのコミットだけをマージするよう、SHA を渡す
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: リリースノートの下書きを作る
        # タグはまだないが、generate-notes は新しいタグ名でも受け付ける
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${TAG}" \
            -f target_commitish="${BRANCH}" \
            --jq '.body' > notes.md \
            || { echo "::warning::リリースノートの下書きを作れなかった"; : > notes.md; }

      - name: PRを開く
        id: pr
        # PR は RELEASE_TOKEN で開く。PAT が開いた PR なら、CI と CodeQL が承認なしで動く。
        # ラベルは GITHUB_TOKEN で付ける。PAT の用途を、PR の作成と状態の確認とマージに絞るため
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
          AUTO_PUBLISH: ${{ inputs.auto_publish }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
          TOKEN_USABLE: ${{ steps.token.outputs.usable }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # 本文は、PR をどのトークンで開くかで変える。引数は pat か github-token
          write_body() {
            {
              echo "\`${DEVELOP_BRANCH}\` の内容を ${TAG} としてリリースします。"
              echo
              if [ "$1" = 'pat' ] && [ "${AUTO_MERGE}" = 'true' ]; then
                echo "チェックが済んで通ったら、「リリース」ワークフローがこの PR をマージコミットでマージします。"
                echo "止めたいときは、マージされる前にこの PR を閉じ、ブランチ \`${BRANCH}\` も消してください。ブランチが残ると、次のリリースが止まります。"
              else
                echo "**マージコミット（Create a merge commit）でマージしてください。** squash や rebase は使いません。"
              fi
              echo
              echo "この PR がマージされると「リリースを公開する」ワークフローが動き、次を行います。"
              echo
              echo "1. タグ \`${TAG}\` を打ちます"
              echo "1. GitHub Release をドラフトで作り、配布物を添付します"
              echo "1. \`${MAIN_BRANCH}\` を \`${DEVELOP_BRANCH}\` に戻します"
              if [ "${AUTO_PUBLISH}" = 'true' ]; then
                echo "1. 配布物の中身を確かめ、通れば Release を公開します"
              else
                echo "1. Release はドラフトのまま残します。Releases の画面で「Publish release」を押してください"
              fi
              echo
              echo "検査（\`npm run lint\`）は、ワークフローの中でも済ませています。"
              if [ "$1" != 'pat' ]; then
                echo "この PR は GITHUB_TOKEN で開いたため、CI は「承認待ち」で作られます。"
                echo "マージの前に「Approve workflows to run」を押すか、PR を閉じて開き直してください。"
              fi
              echo
              echo "## 変更の一覧（下書き）"
              echo
              cat notes.md
            } > body.md
          }

          # 引数はトークン
          create_pr() {
            GH_TOKEN="$1" gh pr create \
              --base "${MAIN_BRANCH}" \
              --head "${BRANCH}" \
              --title "リリース ${TAG}" \
              --body-file body.md
          }

          url=''
          by='github-token'
          if [ "${TOKEN_USABLE}" = 'true' ]; then
            write_body pat
            if url="$(create_pr "${RELEASE_TOKEN}")"; then
              by='pat'
            else
              echo "::warning::RELEASE_TOKEN で PR を開けなかった。PAT の「Pull requests」の権限を確かめる。GITHUB_TOKEN で開く"
              url=''
            fi
          fi
          if [ -z "${url}" ]; then
            write_body github-token
            url="$(create_pr "${GH_TOKEN}")"
          fi
          number="${url##*/}"

          auto_merge=false
          if [ "${AUTO_MERGE}" = 'true' ]; then
            if [ "${by}" = 'pat' ]; then
              auto_merge=true
            else
              echo "::warning::RELEASE_TOKEN が使えないため、PR は自動ではマージしない。チェックが通ったら人がマージする"
            fi
          fi
          {
            echo "number=${number}"
            echo "url=${url}"
            echo "auto_merge=${auto_merge}"
          } >> "$GITHUB_OUTPUT"

          # ラベラーは、PAT で開いた PR では動くが、GITHUB_TOKEN で開いた PR では動かない。
          # どちらでも付くように、ここで付ける。ラベルがないリポジトリでも PR は開けるようにする
          gh pr edit "${number}" --add-label 'リリース' \
            || echo "::warning::ラベル「リリース」を付けられなかった。.github/labels.yml の同期が済んでいるか確かめる"

          # release-publish.yml には入力が届かないため、ラベルで伝える。
          # 公開を取りやめたくなったら、マージの前にこのラベルを外す
          if [ "${AUTO_PUBLISH}" = 'true' ]; then
            gh pr edit "${number}" --add-label '自動公開' \
              || echo "::warning::ラベル「自動公開」を付けられなかった。PR をマージしても Release はドラフトのままになる"
          fi

          {
            echo "## リリース ${TAG}"
            echo
            echo "- PR: ${url}"
            echo "- ブランチ: \`${BRANCH}\`"
            echo "- PR を開いたトークン: ${by}"
            echo "- 自動でマージする: ${auto_merge}"
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: PRをマージする
    # RELEASE_TOKEN で PR を開けたときだけ動く。GITHUB_TOKEN で開いた PR は CI が承認待ちで、待っても通らないため
    if: needs.prepare.outputs.auto_merge == 'true'
    needs: prepare
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # チェックを待つ上限（30分）と、マージのやり直しの分を見込む
    timeout-minutes: 40
    permissions:
      contents: read         # 待ち合わせのスクリプトを取り出す
      pull-requests: read    # PR を読む
      checks: read           # チェックの結果を読む
      statuses: read         # コミットのステータスを読む
      actions: read          # gh pr checks がワークフローの実行を読む
    steps:
      - name: GitHub CLIがあることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）がない。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: 待ち合わせのスクリプトを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: チェックが通るのを待ってマージする
        # PR の状態は PAT で読み、マージも PAT で行う。prepare が push したコミットだけをマージする。
        # PAT でマージすると pull_request(closed) で release-publish.yml が動き、タグと Release を作って公開まで進む。
        # 失敗したときは PR が開いたまま残る。人がマージすれば、同じく release-publish.yml が続きを行う
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          EXPECT_BASE: ${{ env.MAIN_BRANCH }}
          EXPECT_HEAD_PREFIX: release/
          EXPECT_SHA: ${{ needs.prepare.outputs.head_sha }}
          WAIT_MINUTES: '30'
          MERGE_BODY: '「リリース」ワークフローが、チェックの完了を待ってマージした。'
        run: bash .github/scripts/merge-pr.sh
