; エンディングの歌詞の字幕の設定
; 書き換えたら、エンディングを見直すと反映されます（ゲームの再起動は要りません）。
; 大きさと距離は、画面が1920x1080のときの値です。ほかの大きさでは、ゲームが拡大縮小します。

; 字幕を出す位置。bottom で中央下、top で中央上
; 行ごとに変えるときは、lyrics.srt の行の頭に {\an8}（中央上）か {\an2}（中央下）を書きます
position = bottom

; 画面の端（中央下なら下端、中央上なら上端）からの距離
margin = 72

; 文字の大きさ
size = 30

; 文字の後ろに敷く黒い帯の濃さ。0 から 1 で、0 なら敷きません
plate = 0.75
